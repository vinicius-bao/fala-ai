name: build

on:
  workflow_dispatch:        # rodar manualmente pelo site do GitHub
  push:
    tags: ["v*"]            # ao criar uma tag de versão (ex.: v0.2.0)

permissions:
  contents: write           # necessário para publicar o Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Testes
        run: python -m unittest discover -s tests

      - name: Definir versao (a partir da tag)
        id: ver
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          if ("${{ github.ref_type }}" -ne "tag" -or -not $ver) { $ver = "0.1.0" }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          (Get-Content src/assistente_voz/__init__.py) `
            -replace '__version__ = ".*"', "__version__ = `"$ver`"" `
            | Set-Content src/assistente_voz/__init__.py

      - name: Gerar icone
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/make_icon.py

      - name: PyInstaller
        run: pyinstaller --noconfirm FalaAI.spec

      # Assinatura só acontece se os segredos existirem no repositório.
      # Sem eles, o build segue normalmente (o app fica sem assinatura).
      - name: Assinar o executável
        if: ${{ env.CERT != '' }}
        env:
          CERT: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like "*x64*" } |
            Select-Object -First 1).FullName
          & $signtool sign /f cert.pfx /p $env:CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            "dist\FalaAI\FalaAI.exe"

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Gerar instalador
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ steps.ver.outputs.version }} installer.iss

      - name: Assinar o instalador
        if: ${{ env.CERT != '' }}
        env:
          CERT: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like "*x64*" } |
            Select-Object -First 1).FullName
          & $signtool sign /f cert.pfx /p $env:CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            "installer\FalaAI-Setup.exe"
          Remove-Item cert.pfx -Force

      - name: Upload do instalador (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: FalaAI-Setup
          path: installer/FalaAI-Setup.exe

      - name: Publicar Release (somente em tag)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/FalaAI-Setup.exe
          generate_release_notes: true
